name: PWNPet CLI Unit Tests

on:
  push:
    branches: ["main", "develop", "refactor"]
    # Only trigger if there are changes in pwnpet_cli/, tests/ or the test workflow itself
    paths:
      - "pwnpet_cli/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: ["main", "dev"]
    paths:
      - "pwnpet_cli/**"
      - "tests/**"
      - ".github/workflows/tests.yml"

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      # ── 1. Clone the repository ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Configure Python ──────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pwnpet_cli/requirements.txt

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r pwnpet_cli/requirements.txt

      # ── 4. Run tests ─────────────────────────────────
      - name: Run tests
        run: |
          pytest tests/ \
            --cov=pwnpet_cli \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      # ── 5. Upload coverage to Codecov ───────────────────────────
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          flags: pwnpet_cli           # Label to distinguish in Codecov
          fail_ci_if_error: false
